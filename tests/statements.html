<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script defer src="https://cdn.jsdelivr.net/npm/x_ite@latest/dist/x_ite.min.js"></script>
    <style>
@import url("https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400&family=Source+Sans+3:ital,wght@0,400&display=swap");

@media (prefers-color-scheme: light) {
  :root {
    --text-color: rgb(42, 42, 42);
    --background-color: white;
    --link-color: rgb(0, 86, 178);
    --link-hover-color: rgb(210, 96, 58);
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --text-color: rgb(175, 176, 177);
    --background-color: rgb(27, 27, 30);
    --link-color: rgb(82, 108, 150);
    --link-hover-color: rgb(210, 96, 58);
  }
}

body {
  color-scheme: light dark;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  margin: 0px;
  padding: 0px;
  height: 100vh;
  background-color: var(--background-color);
  color: var(--text-color);
  font-family: "Source Sans 3", sans-serif;
  font-size: 1.08rem;
}

body > * {
  flex: 0 0 auto;
  padding: 0px 1rem;
}

h1 {
   font-family: Lato, sans-serif;
}

x3d-canvas {
  flex: 1 1 auto;
  box-sizing: border-box;
  border-top: 1px solid color-mix(in srgb, var(--text-color), transparent 90%);
  border-bottom: 1px solid color-mix(in srgb, var(--text-color), transparent 90%);
  padding: 0px;
  width: 100%;
  height: 100%;
}

a {
  color: var(--link-color);
}

a:hover {
  color: var(--link-hover-color);
}
    </style>
  </head>
  <body>
    <h1>statements.html</h1>
    <x3d-canvas>

        <head>
          <component name='Core' level='2'></component>

<![CDATA[data:x-shader/x-vertex,#version 300 es

precision highp float;
precision highp int;

uniform mat4 x3d_ProjectionMatrix;
uniform mat4 x3d_ModelViewMatrix;

void
main ()
{

}
]]>

                  <ShaderPart DEF='FragmentShader'

<![CDATA[data:x-shader/x-fragment,#version 300 es

out vec4 x3d_FragColor;

void
main ()
{

}
]]>
                  </ShaderPart>
                </ComposedShader>
              </Appearance>
              <Box USE='Geometry'></Box>
            </Shape>
          </Transform>
          <ProtoInstance name='Proto' DEF='Instance'>
            <fieldValue name='name' value='CustomProto'></fieldValue>

          <Script type='model/x3d+xml'>

            <field accessType='inputOutput' type='SFImage' name='image' value='1 1 3
              0xffaa33'></field>

          </Script>
          <Inline DEF='Inline'
              url='"box.x3dv"'></Inline>
          <IMPORT inlineDEF='Inline' importedDEF='ExportedBox' AS='ImportedBox' DESCRIPTION='ImportedBox Description'></IMPORT>
          <ROUTE fromNode='Box1' fromField='translation_changed' toNode='Box2' toField='set_translation'></ROUTE>
          <ROUTE fromNode='Box2' fromField='translation_changed' toNode='Box1' toField='set_translation'></ROUTE>
          <EXPORT localDEF='Box1' AS='ExportedBox' DESCRIPTION='ExportedBox Description'></EXPORT>
        </Scene>
